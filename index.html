<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#34363b" />
    <title>班表查詢</title>
    
    <!-- 專門控制通訊軟體(LINE/FB)連結預覽的設定 -->
    <meta name="description" content=" " />
    <meta property="og:title" content="班表查詢" />
    <meta property="og:description" content=" " />
    <meta property="og:type" content="website" />

    <style>
      :root {
        color: #f7f7fb;
        background: #34363b;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { min-width: 320px; background: #34363b; }
      button { font: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #b5b6ff; outline-offset: 2px; }
      input, select { font: inherit; color: #f7f7fb; background: #2f3136; border: 1px solid #565a64; border-radius: 8px; padding: 6px 10px; }

      .app { width: min(1040px, calc(100% - 28px)); margin: 0 auto; padding: 24px 0 48px; }

      .card { border: 1px solid #565a64; border-radius: 16px; background: #3b3e44; padding: 20px; margin-bottom: 16px; }
      
      .status-card { border: 2px solid #6e70df; }
      .control-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
      .input-group { display: flex; align-items: center; gap: 8px; }
      .input-group label { color: #b5b9c4; font-size: .9rem; font-weight: 700; }
      .today-stamp { color: #bcc0ca; font-size: .85rem; font-weight: 600; font-variant-numeric: tabular-nums; }
      
      .result-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #565a64; }
      .code-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 48px; padding: 6px 12px; border-radius: 999px; background: #6e70df; color: #fff; font-weight: 850; font-size: 1.1rem; }
      .code-pill.empty { background: #4a4e57; color: #c7cad4; }
      .code-meaning { color: #f7f7fb; font-size: 1.05rem; font-weight: 700; }

      .calendar-card { padding: 20px; background: #2f3136; }
      .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
      .calendar-header h2 { font-size: 1.15rem; font-weight: 700; margin: 0; color: #e3e5e8; }
      
      .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 12px; font-size: 0.85rem; font-weight: 700; color: #9ea2ad; }
      .calendar-weekdays .blue-text { color: #5865F2; }
      
      .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px 0; }
      .cal-cell { display: flex; flex-direction: column; align-items: center; padding: 8px 0; cursor: pointer; border-radius: 12px; transition: background 0.2s; user-select: none; }
      .cal-cell:hover { background: #3b3e44; }
      
      .cal-date { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 600; border-radius: 50%; color: #dcddde; margin-bottom: 4px; }
      .cal-cell.selected .cal-date { background: #3b48e0; color: #ffffff; font-weight: 700; }
      
      .cal-shift { font-size: 0.8rem; font-weight: 700; color: #8a8cff; min-height: 16px; }
      .cal-shift.empty { color: transparent; }

      @media (max-width: 640px) {
        .app { padding: 16px 0; }
        .card { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <article class="card status-card">
        <div class="control-row">
          <div class="input-group">
            <label for="daySelect">日期</label>
            <select id="daySelect"></select>
          </div>
          <div class="today-stamp" id="todayStamp"></div>
        </div>
        
        <div class="result-row">
          <span class="code-pill" id="codePill">--</span>
          <span class="code-meaning" id="codeMeaning">無資料</span>
        </div>
      </article>

      <article class="card calendar-card" id="calendarCard">
        <div class="calendar-header">
          <h2 id="calendarTitle"></h2>
        </div>
        <div class="calendar-weekdays">
          <span class="blue-text">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="blue-text">六</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </article>
    </main>

    <script>
      (() => {
        const $ = id => document.getElementById(id);
        const el = {
          todayStamp: $("todayStamp"), daySelect: $("daySelect"),
          codePill: $("codePill"), codeMeaning: $("codeMeaning"),
          calendarCard: $("calendarCard"), calendarTitle: $("calendarTitle"), calendarGrid: $("calendarGrid"),
        };

        const CODE_MAP = { 
          A1: "05:00 上班", A3: "06:30 上班", A4: "07:00 上班", 
          C2: "14:30 上班", C3: "14:30 上班", C6: "15:00 上班",
          "休": "休假", "例": "例假", "國": "國定假日", "喪": "喪假"
        };
        
        let schedule = { 
          year: 2026, month: 9, 
          staff: [
            {
              name: "倪郡嶸",
              codes: {
                1: "A1", 2: "休", 3: "C3", 4: "C2", 5: "例",
                6: "C2", 7: "休", 8: "A1", 9: "A1", 10: "A1",
                11: "喪", 12: "喪", 13: "例", 14: "A1", 15: "C3",
                16: "休", 17: "C2", 18: "C3", 19: "C3", 20: "例",
                21: "A3", 22: "C2", 23: "休", 24: "例", 25: "國",
                26: "C3", 27: "C2", 28: "C3", 29: "休", 30: "A3"
              }
            }
          ] 
        };

        const taipeiToday = () => {
          const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
          const v = t => Number(p.find(i => i.type === t).value);
          return { year: v("year"), month: v("month"), day: v("day") };
        };
        const daysInMonth = (year, month) => new Date(year, month, 0).getDate();

        function renderStatus() {
          const now = taipeiToday();
          el.todayStamp.textContent = `今日: ${now.month}/${now.day}`;

          const person = schedule.staff[0]; 
          const nDays = daysInMonth(schedule.year, schedule.month);
          const sameMonth = now.year === schedule.year && now.month === schedule.month;

          if (el.daySelect.children.length === 0) {
              const prevSelected = sameMonth ? now.day : 1;
              for (let d = 1; d <= nDays; d++) {
                const opt = document.createElement("option");
                opt.value = d; opt.textContent = `${schedule.month}/${d}`;
                if (d === prevSelected) opt.selected = true;
                el.daySelect.appendChild(opt);
              }
          }
          const selectedDay = +el.daySelect.value;

          if (!person) {
            el.codePill.textContent = "--";
            el.codePill.className = "code-pill empty";
            el.codeMeaning.textContent = "查無資料";
            renderCalendar(null);
            return;
          }

          const code = person.codes[selectedDay] || "";
          el.codePill.textContent = code || "--";
          el.codePill.className = "code-pill" + (code ? "" : " empty");
          el.codeMeaning.textContent = code ? (CODE_MAP[code] || "未設定") : "無班別";

          renderCalendar(person);
        }

        function renderCalendar(person) {
          if (!person) { el.calendarCard.style.display = "none"; return; }
          el.calendarCard.style.display = "block";
          el.calendarTitle.textContent = `${schedule.year}年${schedule.month}月`;

          const grid = el.calendarGrid;
          grid.replaceChildren();

          const nDays = daysInMonth(schedule.year, schedule.month);
          const firstDayOfWeek = new Date(schedule.year, schedule.month - 1, 1).getDay();
          const selectedDay = +el.daySelect.value;

          for (let i = 0; i < firstDayOfWeek; i++) {
            grid.appendChild(document.createElement("div"));
          }

          for (let d = 1; d <= nDays; d++) {
            const cell = document.createElement("div");
            cell.className = "cal-cell";
            if (d === selectedDay) cell.classList.add("selected");

            const dateDiv = document.createElement("div");
            dateDiv.className = "cal-date";
            dateDiv.textContent = d;

            const shiftDiv = document.createElement("div");
            shiftDiv.className = "cal-shift";
            const code = person.codes[d] || "";
            shiftDiv.textContent = code || "-";
            if (!code) shiftDiv.classList.add("empty");

            cell.appendChild(dateDiv);
            cell.appendChild(shiftDiv);
            cell.addEventListener("click", () => {
              el.daySelect.value = d;
              renderStatus();
            });
            grid.appendChild(cell);
          }
        }
        
        el.daySelect.addEventListener("change", renderStatus);
        renderStatus();
      })();
    </script>
  </body>
</html>
