<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14171d" />
    <title>班表小幫手</title>
    <meta name="description" content="班表查詢小幫手" />
    <style>
      :root {
        --bg: #13161c;
        --surface: #1d212b;
        --card-bg: #1e222d;
        --line: #2e3543;
        --ink: #eef1f5;
        --muted: #8e9caa;
        --mine: #262b41;
        --mine-ink: #b0b4ff;
        --band: #3a3020;
        --me-bg: #ffab1f;
        --me-fg: #2b1a00;
        --sun: #ff7588;
        --sat: #8da2fb;
        --primary: #5c67f2;
        --primary-hover: #4e57d4;
        --col-hover: rgba(176, 180, 255, 0.08);
        --col-selected: rgba(176, 180, 255, 0.15);

        color: var(--ink);
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        font-synthesis: none;
        color-scheme: dark;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      * { box-sizing: border-box; }
      html { scrollbar-gutter: stable; overflow-x: hidden; width: 100%; }
      html, body { min-height: 100%; margin: 0; padding: 0; }
      body { 
        min-width: 320px; 
        width: 100%;
        overflow-x: hidden;
        background: var(--bg); 
        font-variant-numeric: tabular-nums;
        -webkit-tap-highlight-color: transparent;
      }
      p, h1, h2, h3 { margin: 0; }
      select, button { font: inherit; color: inherit; }
      select:focus-visible, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      button { border: 0; background: transparent; cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

      /* 自適應外框 */
      .app { 
        width: 100%; 
        max-width: 560px; 
        margin: 0 auto; 
        padding: max(14px, env(safe-area-inset-top)) 14px max(32px, env(safe-area-inset-bottom)); 
        display: flex; 
        flex-direction: column;
        gap: 12px; 
        min-width: 0;
        overflow-x: hidden;
        box-sizing: border-box;
      }

      @media (min-width: 768px) {
        .app { max-width: 680px; padding: 24px 20px 48px; gap: 16px; }
      }

      /* ---------- 頁首 ---------- */
      .header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 2px; width: 100%; }
      h1 { font-size: clamp(1.2rem, 4vw, 1.45rem); font-weight: 700; line-height: 1.2; display: flex; align-items: center; gap: 6px; }
      .today-stamp { display: grid; gap: 1px; justify-items: end; color: var(--muted); font-size: .75rem; }
      .today-stamp strong { color: var(--ink); font-size: .88rem; font-weight: 600; }

      /* ---------- 月份標籤 ---------- */
      .month-label {
        width: 100%; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line);
        background: var(--surface); font-weight: 600; font-size: .88rem; color: var(--ink);
        user-select: none;
      }

      /* ---------- 日期橫向捲動列 ---------- */
      .date-strip { 
        display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; 
        scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; 
        -webkit-overflow-scrolling: touch; width: 100%;
      }
      .date-strip::-webkit-scrollbar { display: none; }
      
      .date-btn {
        flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
        width: clamp(46px, 12vw, 54px); height: clamp(52px, 14vw, 60px); border-radius: 12px; border: 1px solid var(--line);
        background: var(--surface); transition: all 0.15s ease;
      }
      .date-btn .d { font-size: clamp(1rem, 3.5vw, 1.15rem); font-weight: 700; }
      .date-btn .w { font-size: .7rem; color: var(--muted); margin-top: 1px; }
      .date-btn.sun .d, .date-btn.sun .w { color: var(--sun); }
      .date-btn.sat .d, .date-btn.sat .w { color: var(--sat); }
      .date-btn.is-today { border: 2px solid var(--primary); }
      .date-btn.is-selected { background: var(--primary); border-color: var(--primary); color: #fff; transform: scale(1.04); }
      .date-btn.is-selected .w, .date-btn.is-selected.sun .d, .date-btn.is-selected.sun .w, .date-btn.is-selected.sat .d, .date-btn.is-selected.sat .w { color: #fff; opacity: .95; }

      /* ---------- 當日班別 Hero 卡片 (完美適應手機) ---------- */
      .hero { 
        display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); 
        border-radius: 16px; padding: clamp(12px, 3.5vw, 18px); gap: clamp(12px, 3.5vw, 18px); 
        box-shadow: 0 4px 20px rgba(0,0,0,0.25); width: 100%; box-sizing: border-box;
      }
      .hero-code { 
        flex: none; min-width: clamp(60px, 16vw, 76px); padding: clamp(10px, 2.5vw, 14px) clamp(10px, 3vw, 16px); 
        text-align: center; border-radius: 14px; font-size: clamp(1.5rem, 5vw, 1.85rem); font-weight: 800; 
        background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(92, 103, 242, 0.35);
      }
      .hero-code.is-off { background: #5b21b6; color: #ede9fe; box-shadow: 0 4px 12px rgba(91, 33, 182, 0.35); }
      .hero-code.is-leave { background: #854d0e; color: #fef08a; box-shadow: 0 4px 12px rgba(133, 77, 14, 0.35); }

      .hero-text { display: grid; gap: 2px; min-width: 0; flex: 1 1 auto; }
      .hero-date { color: var(--muted); font-size: clamp(.75rem, 2.5vw, .85rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hero-meaning { font-size: clamp(1.15rem, 4vw, 1.4rem); font-weight: 700; color: #fff; }
      .notice { color: var(--muted); font-size: .8rem; line-height: 1.4; padding: 0 2px; }

      /* ---------- 月曆網格視圖 (7天日曆 手機滿版自適應) ---------- */
      .calendar-card {
        background: var(--surface); border: 1px solid var(--line); border-radius: 16px; 
        padding: clamp(12px, 3vw, 18px); box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        width: 100%; box-sizing: border-box; min-width: 0;
      }
      .cal-header { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-weight: 700; font-size: clamp(.78rem, 2.5vw, .9rem); margin-bottom: 8px; }
      .cal-header div { padding: 4px 0; color: #a5b4fc; }
      .cal-header div.sun { color: var(--sun); }
      .cal-header div.sat { color: var(--sat); }

      .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: clamp(3px, 1.2vw, 6px); text-align: center; }
      .cal-cell {
        aspect-ratio: 1 / 1.05; display: flex; flex-direction: column; align-items: center; justify-content: center;
        border-radius: clamp(8px, 2vw, 12px); border: 1px solid transparent; background: rgba(255,255,255,0.02);
        cursor: pointer; transition: background .15s, border-color .15s; padding: 2px 1px; min-height: 44px;
        width: 100%; min-width: 0; margin: 0; box-sizing: border-box; color: inherit;
      }
      .cal-cell:hover { background: rgba(255,255,255,0.06); }
      .cal-cell.empty { background: transparent; cursor: default; }
      .cal-cell .c-d { 
        width: clamp(22px, 6vw, 28px); height: clamp(22px, 6vw, 28px); 
        display: flex; align-items: center; justify-content: center; border-radius: 50%; 
        font-size: clamp(.82rem, 2.8vw, .95rem); font-weight: 700; 
      }
      .cal-cell .c-code { font-size: clamp(.72rem, 2.4vw, .82rem); font-weight: 600; margin-top: 1px; color: #cbd5e1; }
      .cal-cell.is-sun .c-d { color: var(--sun); }
      .cal-cell.is-today .c-d { border: 2px solid var(--primary); color: #a5b4fc; }
      .cal-cell.is-selected { border-color: var(--primary); background: rgba(92, 103, 242, 0.15); }
      .cal-cell.is-selected .c-d { background: var(--primary); color: #fff; }
      .cal-cell.is-selected .c-code { color: #fff; font-weight: 700; }
      .cal-cell .c-code.c-off { color: #c4b5fd; }
      .cal-cell .c-code.c-leave { color: #fde047; }

    </style>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1><span>📅</span> 班表小幫手</h1>
        <div class="today-stamp"><span>今天</span><strong id="todayStamp"></strong></div>
      </header>

      <div class="month-label" id="monthLabel"></div>

      <!-- 橫向快速日期列 -->
      <div class="date-strip" id="dateStrip"></div>
      
      <!-- 當日班別 Hero 卡片 -->
      <article class="hero">
        <div class="hero-code" id="codePill">--</div>
        <div class="hero-text">
          <div class="hero-date" id="heroDate">--</div>
          <div class="hero-meaning" id="codeMeaning">--</div>
        </div>
      </article>
      <p class="notice" id="monthMismatch" style="display:none"></p>

      <!-- 月曆網格視圖 -->
      <section class="calendar-card" id="calendarCard">
        <div class="cal-header">
          <div class="sun">日</div>
          <div>一</div>
          <div>二</div>
          <div>三</div>
          <div>四</div>
          <div>五</div>
          <div class="sat">六</div>
        </div>
        <div class="cal-grid" id="calendarGrid"></div>
      </section>

    </main>

    <script>
      (() => {
        const $ = id => document.getElementById(id);
        const el = {
          todayStamp: $("todayStamp"), monthLabel: $("monthLabel"), dateStrip: $("dateStrip"),
          codePill: $("codePill"), heroDate: $("heroDate"), codeMeaning: $("codeMeaning"),
          monthMismatch: $("monthMismatch"), calendarGrid: $("calendarGrid"),
        };

        const DEFAULT_CODE_MAP = {
          A1: "05:00 上班", A3: "06:30 上班", A4: "07:00 上班", A6: "08:30 上班",
          A8: "09:30 上班", A9: "10:00 上班", C2: "14:30 上班", C3: "14:30 上班",
          C4: "14:30 上班", C6: "15:00 上班", N: "夜班",
          休: "休息日", 例: "例假日", 國: "國定假日", 年: "年假 (特別休假)", 喪: "喪假",
        };

        const PRESETS = {
          "2026-11": {
            year: 2026, month: 11,
            codes: "例,A1,A1,休,A3,A3,A3,例,C3,休,年,C2,例,年,C3,休,C2,C2,例,C2,C3,C2,休,A1,A1,例,C3,C3,C2,年".split(","),
          },
        };

        const settings = { codeMap: DEFAULT_CODE_MAP };
        let schedules = {};
        let currentKey = null;
        let currentDay = null; 

        const taipeiToday = () => {
          const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
          const v = t => Number(p.find(i => i.type === t).value);
          return { year: v("year"), month: v("month"), day: v("day") };
        };
        const weekdayChar = (y, m, d) => ["日", "一", "二", "三", "四", "五", "六"][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
        const daysInMonth = (year, month) => new Date(year, month, 0).getDate();
        const keyOf = (y, m) => `${y}-${m}`;

        function presetToSchedule(preset) {
          const codes = {};
          preset.codes.forEach((c, idx) => { codes[idx + 1] = c; });
          return { year: preset.year, month: preset.month, codes };
        }
        function buildDefaultSchedules() {
          const out = {};
          Object.entries(PRESETS).forEach(([k, preset]) => { out[k] = presetToSchedule(preset); });
          return out;
        }

        function sortedKeys() {
          return Object.keys(schedules).sort((a, b) => {
            const [ay, am] = a.split("-").map(Number);
            const [by, bm] = b.split("-").map(Number);
            return ay * 100 + am - (by * 100 + bm);
          });
        }
        function pickDefaultKey() {
          const now = taipeiToday();
          const nowVal = now.year * 100 + now.month;
          const keys = sortedKeys();
          if (schedules[keyOf(now.year, now.month)]) return keyOf(now.year, now.month);
          const upcoming = keys.find(k => { const [y, m] = k.split("-").map(Number); return y * 100 + m >= nowVal; });
          return upcoming || keys[keys.length - 1] || keys[0];
        }

        function renderMonthLabel() {
          const s = currentSchedule();
          el.monthLabel.textContent = `${s.year} 年 ${s.month} 月`;
        }

        function currentSchedule() { return schedules[currentKey]; }

        function selectDay(d) {
          currentDay = d;
          renderStatus();
        }

        function renderStatus() {
          const now = taipeiToday();
          el.todayStamp.textContent = `${now.year}/${now.month}/${now.day}（${weekdayChar(now.year, now.month, now.day)}）`;

          const sch = currentSchedule();
          const codes = sch.codes;
          const nDays = daysInMonth(sch.year, sch.month);
          const sameMonth = now.year === sch.year && now.month === sch.month;

          if (!currentDay || currentDay > nDays) {
            currentDay = sameMonth ? now.day : 1;
          }

          // 繪製橫向日期列
          el.dateStrip.replaceChildren();
          let selectedBtn = null;
          for (let d = 1; d <= nDays; d++) {
            const wd = weekdayChar(sch.year, sch.month, d);
            const btn = document.createElement("button");
            btn.className = "date-btn";
            if (wd === "日") btn.classList.add("sun");
            if (wd === "六") btn.classList.add("sat");
            if (d === currentDay) {
              btn.classList.add("is-selected");
              selectedBtn = btn;
            }
            if (sameMonth && d === now.day) btn.classList.add("is-today");

            const dSpan = document.createElement("span"); dSpan.className = "d"; dSpan.textContent = d;
            const wSpan = document.createElement("span"); wSpan.className = "w"; wSpan.textContent = wd;
            btn.append(dSpan, wSpan);

            btn.addEventListener("click", () => selectDay(d));
            el.dateStrip.appendChild(btn);
          }

          // 日期列置中
          requestAnimationFrame(() => {
            if (selectedBtn) {
              const strip = el.dateStrip;
              const c = strip.getBoundingClientRect();
              const b = selectedBtn.getBoundingClientRect();
              strip.scrollLeft += (b.left - c.left) - (c.width / 2 - b.width / 2);
            }
          });

          el.monthMismatch.style.display = sameMonth ? "none" : "block";
          if (!sameMonth) el.monthMismatch.textContent = `目前顯示的是 ${sch.month} 月的班表，不是今天所在的月份。`;

          const isToday = sameMonth && currentDay === now.day;
          el.heroDate.textContent = `${isToday ? "今天　" : ""}${sch.month} 月 ${currentDay} 日　週${weekdayChar(sch.year, sch.month, currentDay)}`;

          const code = codes[currentDay] || "";
          el.codePill.textContent = code || "--";
          el.codePill.className = "hero-code";
          if (["休", "例", "國"].includes(code)) el.codePill.classList.add("is-off");
          if (["年", "喪"].includes(code)) el.codePill.classList.add("is-leave");

          el.codeMeaning.textContent = code ? (settings.codeMap[code] || "未設定上班時間") : "尚無資料";

          renderCalendar(codes);
        }

        // 渲染日曆網格 (7天視圖)
        function renderCalendar(codes) {
          const sch = currentSchedule();
          el.calendarGrid.replaceChildren();

          const nDays = daysInMonth(sch.year, sch.month);
          const firstDayWd = new Date(Date.UTC(sch.year, sch.month - 1, 1)).getUTCDay(); // 0 is Sun
          const now = taipeiToday();
          const sameMonth = now.year === sch.year && now.month === sch.month;

          // 前置空白格子
          for (let i = 0; i < firstDayWd; i++) {
            const emptyCell = document.createElement("div");
            emptyCell.className = "cal-cell empty";
            el.calendarGrid.appendChild(emptyCell);
          }

          // 1 ~ nDays
          for (let d = 1; d <= nDays; d++) {
            const wd = (firstDayWd + d - 1) % 7;
            const code = codes[d] || "";
            const isOff = ["休", "例", "國"].includes(code);
            const isLeave = ["年", "喪"].includes(code);

            const cell = document.createElement("button");
            cell.className = "cal-cell";
            if (wd === 0) cell.classList.add("is-sun");
            if (d === currentDay) cell.classList.add("is-selected");
            if (sameMonth && d === now.day) cell.classList.add("is-today");

            const dDiv = document.createElement("div");
            dDiv.className = "c-d";
            dDiv.textContent = d;

            const cDiv = document.createElement("div");
            cDiv.className = "c-code";
            if (isOff) cDiv.classList.add("c-off");
            if (isLeave) cDiv.classList.add("c-leave");
            cDiv.textContent = code || "-";

            cell.append(dDiv, cDiv);
            cell.addEventListener("click", () => selectDay(d));
            el.calendarGrid.appendChild(cell);
          }
        }

        schedules = buildDefaultSchedules();
        currentKey = pickDefaultKey();
        renderMonthLabel();
        renderStatus();
      })();
    </script>
  </body>
</html>
