<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#34363b" />
    <title>班表小幫手</title>
    <style>
      :root {
        color: #f7f7fb;
        background: #34363b;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { min-width: 320px; background: #34363b; }
      button { font: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #b5b6ff; outline-offset: 2px; }
      input, select { font: inherit; color: #f7f7fb; background: #2f3136; border: 1px solid #565a64; border-radius: 8px; padding: 8px 10px; }

      .app { width: min(1040px, calc(100% - 28px)); margin: 0 auto; padding: 26px 0 48px; }

      .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
      .brand { display: flex; align-items: center; gap: 12px; min-width: 0; padding-left: 14px; border-left: 3px solid #8a8cff; }
      .brand-mark { position: relative; width: 46px; height: 46px; flex: none; border: 3px solid #6e70df; border-radius: 14px; background: #3b3e44; }
      .brand-mark::before { position: absolute; inset: 9px; border: 3px solid #d4d5ff; border-radius: 50%; content: ""; }
      .brand-mark::after { position: absolute; top: 6px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: #b5b6ff; content: ""; }
      .eyebrow { display: block; color: #b5b6ff; font-size: .74rem; font-weight: 800; letter-spacing: .1em; }
      h1 { margin: 2px 0 0; font-size: clamp(1.5rem, 4vw, 1.9rem); font-weight: 850; letter-spacing: -.03em; }
      .today-stamp { display: grid; justify-items: end; gap: 2px; color: #bcc0ca; font-size: .78rem; flex: none; }
      .today-stamp strong { color: #f7f7fb; font-size: .96rem; font-variant-numeric: tabular-nums; }

      .card { border: 1px solid #565a64; border-radius: 16px; background: #3b3e44; padding: 20px; }
      .stack { display: grid; gap: 14px; }

      .kicker { color: #b5b6ff; font-size: .74rem; font-weight: 800; letter-spacing: .1em; }
      p { margin: 0; }

      .upload-card { border: 2px dashed #565a64; text-align: center; padding: 26px 18px; cursor: pointer; transition: border-color .15s; }
      .upload-card.drag { border-color: #8a8cff; background: #3f434b; }
      .upload-card input[type=file] { display: none; }
      .upload-title { margin-top: 4px; font-size: 1.05rem; font-weight: 800; }
      .upload-hint { margin-top: 6px; color: #b5b9c4; font-size: .82rem; }
      .file-name { margin-top: 10px; color: #d4d5ff; font-size: .84rem; font-weight: 700; }

      .status-card { border: 2px solid #6e70df; }
      .status-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .status-name { display: flex; align-items: center; gap: 8px; }
      .status-name input { width: 8em; font-weight: 800; }
      .status-title { margin-top: 10px; font-size: clamp(1.3rem, 3vw, 1.7rem); font-weight: 850; letter-spacing: -.03em; }
      .status-detail { margin-top: 6px; color: #c7cad4; font-size: .92rem; font-weight: 600; line-height: 1.5; }
      .status-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
      .code-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; padding: 6px 12px; border-radius: 999px; background: #6e70df; color: #fff; font-weight: 850; font-size: 1rem; }
      .code-pill.empty { background: #4a4e57; color: #c7cad4; }
      .status-picker { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: #b5b9c4; font-size: .82rem; }
      .status-picker select { padding: 6px 8px; }
      .month-mismatch { margin-top: 10px; color: #ffcf87; font-size: .8rem; font-weight: 700; }

      .settings-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
      .settings-head span { font-weight: 800; font-size: .95rem; }
      .settings-head .chev { color: #b5b6ff; transition: transform .15s; }
      .settings-head.open .chev { transform: rotate(90deg); }
      .settings-body { display: none; margin-top: 16px; }
      .settings-body.open { display: grid; gap: 16px; }
      .field-row { display: grid; grid-template-columns: 1fr; gap: 6px; }
      .field-row label { color: #b5b9c4; font-size: .8rem; font-weight: 700; }
      .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
      .code-map-list { display: grid; gap: 8px; }
      .code-map-row { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; align-items: center; }
      .code-map-row input[type=text] { width: 100%; }
      .code-map-row button { color: #ff9b9b; background: transparent; font-size: .8rem; font-weight: 700; padding: 6px; }
      .add-code-btn, .reparse-btn { justify-self: start; padding: 8px 14px; border-radius: 10px; background: #4a4e57; color: #e6e7ff; font-weight: 800; font-size: .82rem; border: 1px solid #676ab7; }
      .reparse-btn { background: #6e70df; color: #fff; border-color: #8587ef; }
      .reset-btn { justify-self: start; padding: 8px 14px; border-radius: 10px; background: transparent; color: #ff9b9b; font-weight: 800; font-size: .82rem; border: 1px solid #7a4e4e; }
      .color-row { display: flex; align-items: center; gap: 10px; }
      .color-row input[type=color] { width: 40px; height: 32px; padding: 2px; }

      .table-card { padding: 0; overflow: hidden; }
      .table-title { padding: 18px 20px 0; }
      .table-title h2 { font-size: 1.15rem; font-weight: 850; letter-spacing: -.03em; margin: 3px 0 0; }
      .table-scroll { margin-top: 14px; overflow: auto; max-width: 100%; }
      table { border-collapse: collapse; font-size: .82rem; white-space: nowrap; }
      thead th { position: sticky; top: 0; background: #33363d; color: #d4d5ff; font-weight: 800; padding: 8px 9px; border-bottom: 1px solid #565a64; z-index: 2; }
      thead th.sun { color: #ff9b9b; }
      thead th.today-col { background: #454a72; }
      tbody th { position: sticky; left: 0; background: #3b3e44; text-align: left; padding: 8px 12px; border-right: 1px solid #565a64; border-bottom: 1px solid #46494f; font-weight: 800; z-index: 1; }
      tbody td { padding: 8px 9px; text-align: center; border-bottom: 1px solid #46494f; color: #dfe1e8; }
      tbody td.today-col { background: rgba(110, 112, 223, .18); }
      tbody tr.highlight th, tbody tr.highlight td { border-top: var(--hl-w, 3px) solid var(--hl-color, #8a8cff); border-bottom: var(--hl-w, 3px) solid var(--hl-color, #8a8cff); }
      tbody tr.highlight th { color: #f5f5ff; }
      .empty-state { padding: 40px 20px; text-align: center; color: #b5b9c4; font-size: .9rem; }

      @media (max-width: 640px) {
        .app { padding: 18px 0 36px; }
        .card { padding: 16px; }
        .header { align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div><span class="eyebrow">班表自動判讀</span><h1>班表小幫手</h1></div>
        </div>
        <div class="today-stamp"><span>今天</span><strong id="todayStamp"></strong></div>
      </header>

      <div class="stack">
        <label class="card upload-card" id="uploadCard" for="fileInput">
          <input type="file" id="fileInput" accept=".xls,.xlsx" />
          <div class="kicker">上傳班表</div>
          <div class="upload-title">點一下上傳班表檔案（.xls / .xlsx）</div>
          <div class="upload-hint">上傳後會自動辨識年月、找到你的那一列，並畫上標記線</div>
          <div class="file-name" id="fileName"></div>
        </label>

        <article class="card status-card" id="statusCard">
          <div class="status-top">
            <div class="kicker" id="monthLabel">尚未上傳班表</div>
            <div class="status-name">
              <span class="kicker" style="letter-spacing:0;font-weight:700;color:#b5b9c4">標記對象</span>
              <input type="text" id="targetName" value="倪正人" />
            </div>
          </div>
          <p class="status-title" id="statusTitle">上傳班表後即可查看今天的班別</p>
          <p class="status-detail" id="statusDetail"></p>
          <div class="status-row" id="statusRow" style="display:none">
            <span class="code-pill" id="codePill">--</span>
            <span id="codeMeaning" style="color:#c7cad4;font-size:.9rem;font-weight:700"></span>
          </div>
          <div class="status-picker" id="statusPicker" style="display:none">
            <span>查看日期</span>
            <select id="daySelect"></select>
          </div>
          <p class="month-mismatch" id="monthMismatch" style="display:none"></p>
        </article>

        <article class="card">
          <div class="settings-head" id="settingsHead">
            <span>進階設定與代碼對照</span>
            <span class="chev">›</span>
          </div>
          <div class="settings-body" id="settingsBody">
            <div class="field-row">
              <label>班別代碼對照時間（用來判斷「今天要幾點上班」）</label>
              <div class="code-map-list" id="codeMapList"></div>
              <button type="button" class="add-code-btn" id="addCodeBtn">＋ 新增代碼</button>
            </div>
            <div class="field-row">
              <label>標記線顏色</label>
              <div class="color-row">
                <input type="color" id="highlightColor" value="#8a8cff" />
                <span style="color:#b5b9c4;font-size:.8rem">用來在表格中標出你的那一列</span>
              </div>
            </div>
            <div class="field-row">
              <label>若自動辨識錯誤，可手動修正後重新解析</label>
              <div class="field-grid">
                <div class="field-row"><label>年</label><input type="number" id="manualYear" /></div>
                <div class="field-row"><label>月</label><input type="number" id="manualMonth" /></div>
                <div class="field-row"><label>日期列（試算表第幾列）</label><input type="number" id="manualDayRow" /></div>
                <div class="field-row"><label>姓名欄（試算表欄位字母，如 D）</label><input type="text" id="manualNameCol" /></div>
              </div>
              <button type="button" class="reparse-btn" id="reparseBtn">用以上設定重新解析</button>
            </div>
            <button type="button" class="reset-btn" id="resetBtn">清除已儲存的班表資料</button>
          </div>
        </article>

        <article class="card table-card" id="tableCard" style="display:none">
          <div class="table-title">
            <div class="kicker">整月班表</div>
            <h2 id="tableTitle"></h2>
          </div>
          <div class="table-scroll"><table id="scheduleTable"></table></div>
        </article>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
      (() => {
        const $ = id => document.getElementById(id);
        const el = {
          fileInput: $("fileInput"), uploadCard: $("uploadCard"), fileName: $("fileName"),
          todayStamp: $("todayStamp"), monthLabel: $("monthLabel"), targetName: $("targetName"),
          statusTitle: $("statusTitle"), statusDetail: $("statusDetail"), statusRow: $("statusRow"),
          codePill: $("codePill"), codeMeaning: $("codeMeaning"), statusPicker: $("statusPicker"),
          daySelect: $("daySelect"), monthMismatch: $("monthMismatch"),
          settingsHead: $("settingsHead"), settingsBody: $("settingsBody"),
          codeMapList: $("codeMapList"), addCodeBtn: $("addCodeBtn"), highlightColor: $("highlightColor"),
          manualYear: $("manualYear"), manualMonth: $("manualMonth"), manualDayRow: $("manualDayRow"),
          manualNameCol: $("manualNameCol"), reparseBtn: $("reparseBtn"), resetBtn: $("resetBtn"),
          tableCard: $("tableCard"), tableTitle: $("tableTitle"), scheduleTable: $("scheduleTable"),
        };

        const DEFAULT_CODE_MAP = { A1: "05:00 上班", A3: "06:30 上班", A4: "07:00 上班", C2: "14:30 上班", C3: "14:30 上班", C6: "15:00 上班" };
        let settings = { targetName: "倪正人", codeMap: { ...DEFAULT_CODE_MAP }, highlightColor: "#8a8cff" };
        let schedule = null; // { year, month, rawRows, dayRowIdx, nameCol, nameHeaderRow, staff:[{row,name,codes:{day:code}}] }

        const taipeiToday = () => {
          const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
          const v = t => Number(p.find(i => i.type === t).value);
          return { year: v("year"), month: v("month"), day: v("day") };
        };
        const weekdayChar = (y, m, d) => ["日", "一", "二", "三", "四", "五", "六"][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
        const colLetterToIndex = s => { s = s.trim().toUpperCase(); let n = 0; for (const ch of s) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };
        const indexToColLetter = i => { let s = "", n = i + 1; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };

        // ---------- Storage ----------
        async function loadStorage() {
          try {
            const s = await window.storage.get("settings", false);
            if (s && s.value) settings = { ...settings, ...JSON.parse(s.value) };
          } catch {}
          try {
            const d = await window.storage.get("schedule-data", false);
            if (d && d.value) schedule = JSON.parse(d.value);
          } catch {}
        }
        async function saveSettings() {
          try { await window.storage.set("settings", JSON.stringify(settings), false); } catch {}
        }
        async function saveSchedule() {
          try { await window.storage.set("schedule-data", JSON.stringify(schedule), false); } catch {}
        }

        // ---------- Parsing ----------
        function findGuesses(rows) {
          let year = null, month = null;
          outer: for (let r = 0; r < rows.length; r++) {
            for (let c = 0; c < rows[r].length; c++) {
              const val = String(rows[r][c] ?? "").trim();
              if (val.includes("月份班表")) {
                for (let cc = c - 1; cc >= 0 && cc >= c - 10; cc--) {
                  const v = String(rows[r][cc] ?? "").trim();
                  if (month === null && /^\d{1,2}$/.test(v) && +v >= 1 && +v <= 12) month = +v;
                  else if (year === null && /^\d{4}$/.test(v)) year = +v;
                }
                break outer;
              }
            }
          }
          let dayRowIdx = -1;
          for (let r = 0; r < rows.length; r++) {
            let count = 0;
            for (let c = 0; c < rows[r].length; c++) {
              const v = String(rows[r][c] ?? "").trim();
              if (/^\d{1,2}$/.test(v) && +v >= 1 && +v <= 31) count++;
            }
            if (count >= 15) { dayRowIdx = r; break; }
          }
          let nameCol = -1, nameHeaderRow = -1;
          for (let r = 0; r < rows.length; r++) {
            for (let c = 0; c < rows[r].length; c++) {
              const v = String(rows[r][c] ?? "");
              if (v.includes("姓名")) { nameCol = c; nameHeaderRow = r; break; }
            }
            if (nameCol !== -1) break;
          }
          return { year, month, dayRowIdx, nameCol, nameHeaderRow };
        }

        function extractStaff(rows, dayRowIdx, nameCol, nameHeaderRow) {
          const dayCols = {};
          if (dayRowIdx >= 0) {
            for (let c = 0; c < rows[dayRowIdx].length; c++) {
              const v = String(rows[dayRowIdx][c] ?? "").trim();
              if (/^\d{1,2}$/.test(v) && +v >= 1 && +v <= 31) dayCols[c] = +v;
            }
          }
          const staff = [];
          const startRow = Math.max(dayRowIdx, nameHeaderRow) + 1;
          if (nameCol >= 0 && startRow >= 1) {
            for (let r = startRow; r < rows.length; r++) {
              const nameRaw = String(rows[r][nameCol] ?? "").trim();
              if (!nameRaw) continue;
              if (/人數|工時|標工時|加班費|#REF/.test(nameRaw)) break;
              const codes = {};
              for (const [colStr, dayNum] of Object.entries(dayCols)) {
                codes[dayNum] = String(rows[r][+colStr] ?? "").trim();
              }
              staff.push({ row: r, name: nameRaw, codes });
            }
          }
          return { dayCols, staff };
        }

        function parseWorkbook(wb) {
          const sheetName = wb.SheetNames[0];
          const ws = wb.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false });
          const guess = findGuesses(rows);
          const { dayCols, staff } = extractStaff(rows, guess.dayRowIdx, guess.nameCol, guess.nameHeaderRow);
          return { year: guess.year, month: guess.month, rawRows: rows, dayRowIdx: guess.dayRowIdx, nameCol: guess.nameCol, nameHeaderRow: guess.nameHeaderRow, dayCols, staff };
        }

        function reparseFromManual() {
          if (!schedule || !schedule.rawRows) return;
          const year = +el.manualYear.value || schedule.year;
          const month = +el.manualMonth.value || schedule.month;
          const dayRowIdx = (+el.manualDayRow.value || (schedule.dayRowIdx + 1)) - 1;
          const nameCol = el.manualNameCol.value ? colLetterToIndex(el.manualNameCol.value) : schedule.nameCol;
          const nameHeaderRow = dayRowIdx; // header row for name column assumed same block as day row area
          const { dayCols, staff } = extractStaff(schedule.rawRows, dayRowIdx, nameCol, schedule.nameHeaderRow);
          schedule = { ...schedule, year, month, dayRowIdx, nameCol, dayCols, staff };
          saveSchedule();
          renderAll();
        }

        // ---------- Rendering ----------
        function fillManualFields() {
          if (!schedule) return;
          el.manualYear.value = schedule.year ?? "";
          el.manualMonth.value = schedule.month ?? "";
          el.manualDayRow.value = schedule.dayRowIdx >= 0 ? schedule.dayRowIdx + 1 : "";
          el.manualNameCol.value = schedule.nameCol >= 0 ? indexToColLetter(schedule.nameCol) : "";
        }

        function renderCodeMapEditor() {
          el.codeMapList.replaceChildren();
          Object.entries(settings.codeMap).forEach(([code, label]) => {
            el.codeMapList.appendChild(codeMapRow(code, label));
          });
        }
        function codeMapRow(code, label) {
          const row = document.createElement("div");
          row.className = "code-map-row";
          const codeInput = document.createElement("input");
          codeInput.type = "text"; codeInput.value = code; codeInput.maxLength = 6;
          const labelInput = document.createElement("input");
          labelInput.type = "text"; labelInput.value = label; labelInput.placeholder = "例如 14:30 上班";
          const delBtn = document.createElement("button");
          delBtn.type = "button"; delBtn.textContent = "刪除";
          const commit = () => {
            const newCode = codeInput.value.trim();
            if (!newCode) return;
            const map = {};
            [...el.codeMapList.children].forEach(r => {
              const c = r.querySelector('input[type=text]').value.trim();
              const l = r.querySelectorAll('input[type=text]')[1].value;
              if (c) map[c] = l;
            });
            settings.codeMap = map;
            saveSettings();
            renderAll();
          };
          codeInput.addEventListener("change", commit);
          labelInput.addEventListener("change", commit);
          delBtn.addEventListener("click", () => { row.remove(); commit(); });
          row.append(codeInput, labelInput, delBtn);
          return r
